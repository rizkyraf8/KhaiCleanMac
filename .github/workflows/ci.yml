name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      # Every L("…", "…") text needs its Japanese, Chinese and Spanish entry; see Localization/Translations.swift.
      - name: Translations
        run: python3 scripts/l10n.py check

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      # The released app is universal, so the Intel slice has to build and pass the tests too.
      # SwiftPM's own test runner is arm64-only; Xcode's xctest is universal and runs under Rosetta.
      - name: Build universal (Apple silicon + Intel)
        run: |
          set -o pipefail
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tee -a build.log

      - name: Test on Intel (Rosetta)
        run: |
          set -o pipefail
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          swift build --build-tests --arch x86_64 2>&1 | tee -a build.log
          BUNDLE="$(swift build --build-tests --arch x86_64 --show-bin-path)/KhaiCleanMacTests.xctest"
          arch -x86_64 "$(xcrun -f xctest)" "$BUNDLE" 2>&1 | tee -a test.log

      # Logs need a GitHub login to read; annotations show on the run summary for everyone.
      - name: Show errors on the run summary
        if: failure()
        run: |
          cat build.log test.log 2>/dev/null \
            | grep -E "error:|fatal error|note: SmallVector|✘|failed" \
            | grep -v "^warning" | head -25 \
            | while IFS= read -r line; do echo "::error::${line}"; done
